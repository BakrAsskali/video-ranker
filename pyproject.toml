[project]
name = "video-ranker"
version = "0.1.0"
description = "Multimodal video ranking system: ingestion, multimodal embeddings, retrieval and learned ranking."
readme = "README.md"
authors = [{ name = "Bakr Asskali" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3>=1.35",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "sqlalchemy>=2.0",
    "yt-dlp>=2025.1.1",
]

[project.optional-dependencies]
ml = [
    "faster-whisper>=1.1",
    "open-clip-torch>=4.2.2",
    "sentencepiece>=0.2.3",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
video-ranker = "video_ranker.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
